[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-cli"
dynamic = ["version"]
description = "Agent-facing research CLI for BGPT, Brave Search, Exa, Firecrawl, and Reddit HTTP APIs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
research-cli = "research_cli.cli:run"

[tool.setuptools.dynamic]
version = { attr = "research_cli.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
