[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-cli"
version = "0.1.0"
description = "Agent-facing research CLI for BGPT, Brave Search, Exa, and Firecrawl HTTP APIs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
research-cli = "research_cli.cli:run"

[tool.setuptools.packages.find]
where = ["src"]
