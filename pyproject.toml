[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-cli"
dynamic = ["version"]
description = "Agent-facing research CLI for BGPT, Brave, Exa, Firecrawl, Reddit, Sploitus, Exploit-DB, Malpedia, X, TGStat, and Telegram"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["telethon>=1.44.0,<2"]

[project.scripts]
research-cli = "research_cli.cli:run"

[tool.setuptools.dynamic]
version = { attr = "research_cli.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
