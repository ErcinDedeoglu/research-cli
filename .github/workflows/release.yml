name: Release binaries

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --disable-pip-version-check -e .
      - name: Run tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v

  version:
    needs: [test]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semver.outputs.version }}
      tag: ${{ steps.semver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bump version
        id: semver
        run: |
          set -euo pipefail
          version="$(python scripts/semver.py next)"
          python scripts/semver.py apply "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
      - name: Commit and tag
        run: |
          set -euo pipefail
          version="${{ steps.semver.outputs.version }}"
          tag="v${version}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- src/research_cli/__init__.py skills/research-cli/SKILL.md; then
            echo "version files already ${version}"
          else
            git add src/research_cli/__init__.py skills/research-cli/SKILL.md
            git commit -m "chore: release ${tag}"
          fi
          if git rev-parse "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "tag ${tag} already exists"
          else
            git tag "$tag"
          fi
          git push origin "HEAD:main"
          git push origin "$tag"

  zipapp:
    needs: [version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build zipapp
        run: bash scripts/build-zipapp.sh dist
      - name: Smoke zipapp
        run: |
          python dist/research-cli.pyz --version
          python dist/research-cli.pyz --help
      - uses: actions/upload-artifact@v4
        with:
          name: research-cli-pyz
          path: dist/research-cli.pyz

  freeze:
    needs: [version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: research-cli-Darwin-arm64
          - os: ubuntu-latest
            artifact: research-cli-Linux-x86_64
          - os: ubuntu-24.04-arm
            artifact: research-cli-Linux-aarch64
          - os: windows-latest
            artifact: research-cli-Windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-freeze.txt
      - name: Install PyInstaller
        run: python -m pip install --disable-pip-version-check -r requirements-freeze.txt
      - name: Freeze
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --name research-cli --paths src --collect-submodules research_cli --hidden-import certifi --collect-all certifi --hidden-import telethon --collect-all telethon src/research_cli/__main__.py
      - name: Name artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist/release
          mv dist/research-cli "dist/release/${{ matrix.artifact }}"
          chmod +x "dist/release/${{ matrix.artifact }}"
          "./dist/release/${{ matrix.artifact }}" --help
      - name: Name artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/release | Out-Null
          Move-Item dist/research-cli.exe "dist/release/${{ matrix.artifact }}"
          & "dist/release/${{ matrix.artifact }}" --help
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/release/${{ matrix.artifact }}

  publish:
    needs: [version, zipapp, freeze]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(artifacts/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no artifacts to publish"
            exit 1
          fi
          notes="research-cli ${TAG} from ${GITHUB_SHA} on ${GITHUB_REF_NAME}."
          if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber --repo "${GITHUB_REPOSITORY}"
            gh release edit "$TAG" --title "research-cli ${TAG}" --notes "$notes" --latest --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "$TAG" "${files[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --title "research-cli ${TAG}" \
              --notes "$notes" \
              --latest
          fi
